<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PriangLab Management System</title>
    <meta name="description" content="Sistem Manajemen Inventaris Gudang & Ekspedisi profesional berbasis React, real-time Firestore, dan barcode scanning." />
    <meta property="og:title" content="PriangLab Management System" />
    <meta property="og:description" content="Sistem Manajemen Inventaris Gudang & Ekspedisi profesional berbasis React, real-time Firestore, dan barcode scanning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PriangLab" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background-color:#0b0f19;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:32px 20px;text-align:center;box-sizing:border-box;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:32px;height:32px;border-radius:8px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#60a5fa;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
              <path d="m3.3 7 8.7 5 8.7-5"></path>
              <path d="M12 22V12"></path>
            </svg>
          </div>
          <div style="text-align:left;">
            <div style="font-size:13px;font-weight:800;letter-spacing:0.08em;color:#f1f5f9;">PRIANGLAB</div>
            <div style="font-size:10px;color:#64748b;font-weight:600;letter-spacing:0.04em;">MANAGEMENT SYSTEM</div>
          </div>
        </div>

        <div style="max-width:380px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:32px 24px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.5);display:flex;flex-direction:column;align-items:center;">
          <div style="width:48px;height:48px;border-radius:12px;background:#1e3a8a;border:1px solid #2563eb;display:flex;align-items:center;justify-content:center;color:#93c5fd;margin-bottom:16px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="5" rx="2"></rect>
              <line x1="2" x2="22" y1="10" y2="10"></line>
            </svg>
          </div>
          <div style="font-size:15px;font-weight:800;color:#f8fafc;letter-spacing:-0.01em;margin-bottom:4px;">
            Memuat Sistem Gudang
          </div>
          <div style="font-size:11px;color:#94a3b8;font-weight:500;line-height:1.5;margin-bottom:24px;">
            Menyiapkan basis data inventaris, sinkronisasi multi-device &amp; modul pemindai barcode...
          </div>

          <div style="width:100%;height:3px;background-color:#1e293b;border-radius:9999px;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;left:0;height:100%;width:40%;background-color:#2563eb;border-radius:9999px;animation:sysTrack 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>

          <style>
            @keyframes sysTrack {
              0% { left: -40%; width: 30%; }
              50% { left: 30%; width: 50%; }
              100% { left: 100%; width: 30%; }
            }
          </style>

          <div style="margin-top:20px;display:flex;align-items:center;gap:6px;font-size:10px;color:#64748b;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;"></span>
            <span>CLOUD SYNC STANDBY</span>
          </div>
        </div>

        <div style="font-size:11px;color:#64748b;font-weight:500;display:flex;flex-direction:column;gap:4px;align-items:center;">
          <div style="color:#94a3b8;font-weight:600;">Made By Raia Haikal Rabbani</div>
          <div style="font-size:10px;color:#475569;">PriangLab Management System &bull; Versi Operasional v2.0</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
