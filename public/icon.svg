<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer glowing rim -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Isometric Warehouse Box / Container -->
  <g transform="translate(106, 100)">
    <!-- Top Face -->
    <polygon points="150,20 280,85 150,150 20,85" fill="#3b82f6" />
    <!-- Left Face -->
    <polygon points="20,85 150,150 150,290 20,225" fill="#1d4ed8" />
    <!-- Right Face -->
    <polygon points="150,150 280,85 280,225 150,290" fill="#2563eb" />
    
    <!-- Box Flaps Details -->
    <line x1="150" y1="20" x2="150" y2="150" stroke="#60a5fa" stroke-width="3" />
    <line x1="20" y1="85" x2="280" y2="85" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Barcode Symbol on front face -->
    <g transform="translate(50, 150) skewY(26.5) scale(0.65)">
      <rect x="0" y="0" width="130" height="70" rx="8" fill="#ffffff" />
      <!-- Barcode lines -->
      <line x1="15" y1="12" x2="15" y2="58" stroke="#0f172a" stroke-width="4" />
      <line x1="24" y1="12" x2="24" y2="58" stroke="#0f172a" stroke-width="2" />
      <line x1="32" y1="12" x2="32" y2="58" stroke="#0f172a" stroke-width="5" />
      <line x1="44" y1="12" x2="44" y2="58" stroke="#0f172a" stroke-width="2" />
      <line x1="52" y1="12" x2="52" y2="58" stroke="#0f172a" stroke-width="4" />
      <line x1="62" y1="12" x2="62" y2="58" stroke="#0f172a" stroke-width="3" />
      <line x1="72" y1="12" x2="72" y2="58" stroke="#0f172a" stroke-width="6" />
      <line x1="84" y1="12" x2="84" y2="58" stroke="#0f172a" stroke-width="2" />
      <line x1="94" y1="12" x2="94" y2="58" stroke="#0f172a" stroke-width="4" />
      <line x1="104" y1="12" x2="104" y2="58" stroke="#0f172a" stroke-width="5" />
      <line x1="115" y1="12" x2="115" y2="58" stroke="#0f172a" stroke-width="3" />
    </g>
  </g>

  <!-- Laser Scan Beam Accent -->
  <line x1="60" y1="280" x2="452" y2="280" stroke="#ef4444" stroke-width="5" stroke-linecap="round" filter="drop-shadow(0 0 10px #ef4444)" />
  <circle cx="256" cy="280" r="7" fill="#fca5a5" />

  <!-- App Branding Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PRIANGLAB
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    WMS &amp; LOGISTICS
  </text>
</svg>
